[tool.uv.workspace]
members = ["server", "indexer"]

# CPU-only torch for the api's Qwen query encoder: the CUDA wheels are gigabytes
# the host never uses.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["server/tests", "indexer/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
