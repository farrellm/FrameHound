server {
  listen 80;
  root /usr/share/nginx/html;

  # Re-resolve the api through Docker's DNS, so recreating its container
  # doesn't leave nginx pointing at a stale IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8000;

  # tailscale serve terminates TLS in front of nginx; the api marks its sign-in
  # cookie Secure when the original request was https.
  set $fwd_proto $scheme;
  if ($http_x_forwarded_proto) {
    set $fwd_proto $http_x_forwarded_proto;
  }

  # The SPA calls /api/...; the api serves at its root.
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Connection "";
    # SSE progress streams must not be buffered; video uses Range requests.
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 25m;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
