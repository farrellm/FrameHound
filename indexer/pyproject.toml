[project]
name = "framehound-indexer"
version = "0.1.0"
description = "FrameHound indexing pipeline and query encoders"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pyarrow>=16",
  "faiss-cpu>=1.8",
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
  "huggingface-hub>=0.24",
  "zstandard>=0.22",
  "httpx>=0.27",
  "pillow>=10",
]

[project.optional-dependencies]
# The pipeline's transcript stage; the api only needs the query encoders.
asr = ["faster-whisper>=1.0"]
# The Qwen3-VL-Embedding visual model (models.qwen.lock); torch(vision) come from the
# CPU index (root pyproject), the Colab VM brings its own CUDA build.
qwen = ["torch>=2.8", "torchvision>=0.23", "transformers>=4.57"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["framehound_indexer"]
