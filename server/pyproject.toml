[project]
name = "framehound"
version = "0.1.0"
description = "FrameHound api and workers"
requires-python = ">=3.12"
dependencies = [
  "framehound-indexer",
  "colabkit",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "rq>=1.16",
  "redis>=5",
  "rapidfuzz>=3.9",
  "numpy>=1.26",
  "pyarrow>=16",
  "faiss-cpu>=1.8",
  "libtorrent>=2.1",
]

[project.scripts]
framehound-api = "framehound.api:main"
framehound-worker = "framehound.worker:main"

[tool.uv.sources]
framehound-indexer = { workspace = true }
colabkit = { url = "https://github.com/farrellm/colabkit/archive/refs/tags/v0.1.0.tar.gz" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["framehound"]
