# FrameHound: docker compose up -d, then open http://localhost:8080
# Binds to localhost only (design.md §10); see .env.example for settings.

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  image: framehound-backend
  env_file:
    - path: .env
      required: false
  environment:
    REDIS_URL: redis://redis:6379/0
  volumes:
    # FH_DATA_DIR (a host path) bind-mounts it instead of the named volume.
    - ${FH_DATA_DIR:-fh-data}:/data
    # Movie files, when MEDIA_DIR=/library splits them off /data (.env.example).
    - ${FH_MEDIA_DIR:-fh-media}:/library
    # Movie files to add from the server, when IMPORT_DIR=/import (.env.example).
    - ${FH_IMPORT_DIR:-fh-import}:/import:ro
    # The colab CLI's sign-in and session state (run `colab usage` once on the host
    # to sign in). Shared with the host so `colab sessions` shows the same names.
    - ${COLAB_CONFIG_DIR:-~/.config/colab-cli}:/home/fh/.config/colab-cli
  depends_on:
    - redis
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    # Persist the queues, so a restart doesn't drop queued jobs (the api also
    # re-enqueues any it finds missing at startup).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${FH_REDIS_DIR:-fh-redis}:/data
    restart: unless-stopped

  api:
    <<: *backend
    # A hard cap, swap included, so it can't push the host into swap: a search
    # model is a few GB once loaded. Restarts if it ever hits the limit.
    mem_limit: ${FH_API_MEM:-6g}
    memswap_limit: ${FH_API_MEM:-6g}

  worker-io:
    <<: *backend
    command: ["framehound-worker", "io"]
    # Torrents download here, MAX_DOWNLOADS at once, each on its own port from
    # TORRENT_PORT up. Publishing the ports lets peers connect in, not just out,
    # for better swarms. Same numbers inside and out: libtorrent tells peers the
    # port it listens on.
    environment:
      REDIS_URL: redis://redis:6379/0
      TORRENT_LISTEN: 0.0.0.0:${TORRENT_PORT:-6881},[::]:${TORRENT_PORT:-6881}
    ports:
      - "${TORRENT_PORT:-6881}-${TORRENT_PORT_LAST:-6883}:${TORRENT_PORT:-6881}-${TORRENT_PORT_LAST:-6883}/tcp"
      - "${TORRENT_PORT:-6881}-${TORRENT_PORT_LAST:-6883}:${TORRENT_PORT:-6881}-${TORRENT_PORT_LAST:-6883}/udp"

  worker-index:
    <<: *backend
    # Also re-attaches to Colab jobs after a restart and stops orphaned sessions.
    command: ["framehound-worker", "index"]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${FH_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  fh-data:
  fh-media:
  fh-import:
  fh-redis:
