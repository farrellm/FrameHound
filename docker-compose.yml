# FrameHound: docker compose up -d, then open http://localhost:8080
# Binds to localhost only (design.md §10); see .env.example for settings.

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  image: framehound-backend
  env_file:
    - path: .env
      required: false
  environment:
    REDIS_URL: redis://redis:6379/0
  volumes:
    - fh-data:/data
    # The colab CLI's sign-in and session state (run `colab usage` once on the host
    # to sign in). Shared with the host so `colab sessions` shows the same names.
    - ${COLAB_CONFIG_DIR:-~/.config/colab-cli}:/home/fh/.config/colab-cli
  depends_on:
    - redis
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    <<: *backend

  worker-io:
    <<: *backend
    command: ["framehound-worker", "io"]
    # Torrents download here. Publishing the port lets peers connect in, not
    # just out, for better swarms. Same number inside and out: libtorrent tells
    # peers the port it listens on.
    environment:
      REDIS_URL: redis://redis:6379/0
      TORRENT_LISTEN: 0.0.0.0:${TORRENT_PORT:-6881},[::]:${TORRENT_PORT:-6881}
    ports:
      - "${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}/tcp"
      - "${TORRENT_PORT:-6881}:${TORRENT_PORT:-6881}/udp"

  worker-index:
    <<: *backend
    # Also re-attaches to Colab jobs after a restart and stops orphaned sessions.
    command: ["framehound-worker", "index"]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${FH_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  fh-data:
