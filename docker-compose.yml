# FrameHound: docker compose up -d, then open http://localhost:8080
# Binds to localhost only (design.md §10); see .env.example for settings.

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  image: framehound-backend
  env_file:
    - path: .env
      required: false
  environment:
    REDIS_URL: redis://redis:6379/0
  volumes:
    - fh-data:/data
  depends_on:
    - redis
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    <<: *backend

  worker-io:
    <<: *backend
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "io"]

  worker-index:
    <<: *backend
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "index"]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${FH_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  fh-data:
